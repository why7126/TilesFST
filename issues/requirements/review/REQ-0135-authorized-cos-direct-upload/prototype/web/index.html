<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQ-0135 上传状态原型</title><style>:root{  --color-page: #18160f;
  --color-surface: #211e16;
  --color-secondary: #211e16;
  --color-deep: #100f0a;
  --color-bg-overlay: rgb(255 255 255 / 0.04);
  --color-bg-badge-neutral: rgb(255 255 255 / 0.07);
  --color-text-primary: #ede8df;
  --color-text-secondary: rgb(237 232 223 / 0.5);
  --color-text-muted: rgb(237 232 223 / 0.3);
  --color-text-subtle: rgb(237 232 223 / 0.25);
  --color-text-nav-link: rgb(237 232 223 / 0.45);
  --color-text-brand: #c8a055;
  --color-text-hot-sale: #e07050;
  --color-text-on-brand: #18160f;
  --color-brand-gold: #c8a055;
  --color-brand-gold-muted: rgb(200 160 85 / 0.12);
  --color-brand-gold-border: rgb(200 160 85 / 0.5);
  --color-brand-gold-badge: rgb(200 160 85 / 0.15);
  --color-error: #e07050;
  --color-hot-sale: #e07050;
  --color-hot-sale-muted: rgb(196 80 50 / 0.15); --border:var(--color-text-muted);color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--color-page);color:var(--color-text-primary);font:15px/1.6 system-ui,sans-serif}header,footer{padding:24px 32px;border-bottom:1px solid var(--border)}header p,.muted{color:var(--color-text-secondary)}.tools{padding:20px;text-align:center}.upload-dialog{width:min(880px,calc(100vw - 32px));margin:16px auto;background:var(--color-surface);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 130px)}h1{font-size:22px;margin:0}p{margin:8px 0}.body{overflow:auto;padding:28px 32px;min-height:0}button,select{font:inherit;border:1px solid var(--border);background:var(--color-deep);color:var(--color-text-primary);border-radius:8px;padding:9px 16px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--color-brand-gold);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--color-brand-gold);color:var(--color-text-on-brand)}.card{border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px}.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.thumb{width:100px;height:100px;border-radius:8px;background:linear-gradient(135deg,var(--color-text-muted),var(--color-deep),var(--color-brand-gold-muted));display:grid;place-items:center;color:var(--color-brand-gold)}.grow{flex:1;min-width:180px}.status{color:var(--color-brand-gold)}progress{width:100%;accent-color:var(--color-brand-gold);height:7px}.error{color:var(--color-error)}footer{border-top:1px solid var(--border);border-bottom:0;display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px}small{color:var(--color-text-secondary)}@media(max-width:600px){header,footer,.body{padding:16px}footer{flex-wrap:wrap}}</style><div class="tools"><label>原型状态 <select id="scenario"><option value="upload">上传中</option><option value="verify">校验中</option><option value="process">图片处理中</option><option value="failed">处理失败</option><option value="ready">可保存</option><option value="savefail">保存失败</option><option value="cancelled">已取消</option></select></label> <button id="finish">模拟阶段完成</button></div><section class="upload-dialog" role="dialog" aria-labelledby="title"><header><small>商品管理 / 编辑商品</small><h1 id="title">编辑瓷砖商品</h1><p>暖灰石纹 · 800 × 800 mm</p></header><div class="body"><strong>商品媒体</strong><p class="muted">添加图片或视频，文件准备好后可保存至商品。</p><div class="card"><div class="row"><div class="thumb" id="preview" aria-label="示例媒体预览">▶</div><div class="grow"><strong id="filename">商品展示.mp4</strong><p class="muted" id="size">59 MB · 视频</p><div role="status" aria-live="polite"><p class="status" id="status"></p><progress id="progress" max="100" value="62"></progress><p id="error" class="error"></p></div></div><button id="retry" hidden>重试处理</button><button id="cancel">取消上传</button></div></div><p class="muted">上传完成后还需校验文件；图片需要生成展示版本。</p></div><footer><small id="hint">请等待文件准备完成</small><div class="actions"><button id="save" class="primary" disabled>保存商品</button></div></footer></section><script>const el=id=>document.getElementById(id);let state='upload';const labels={upload:'正在上传 · 62%',verify:'已传输 100% · 正在校验',process:'正在生成图片展示版本',failed:'图片处理失败',ready:'文件已准备好',savefail:'文件已准备好',cancelled:'本次上传已取消',saved:'商品已保存'};function render(s){state=s;const image=['process','failed'].includes(s);el('filename').textContent=image?'暖灰石纹.jpg':'商品展示.mp4';el('size').textContent=image?'8 MB · 图片':'59 MB · 视频';el('preview').textContent=image?'图片':'▶';el('status').textContent=labels[s];el('error').textContent=s==='failed'?'展示版本生成失败，原图已保留。请重试处理。':s==='savefail'?'商品保存失败，文件仍可用。请重试保存。':'';el('retry').hidden=s!=='failed';el('progress').hidden=!['upload','verify'].includes(s);el('progress').value=s==='upload'?62:100;el('save').disabled=!['ready','savefail'].includes(s);el('save').textContent=s==='savefail'?'重试保存':'保存商品';el('hint').textContent=['ready','savefail'].includes(s)?'保存后关联至当前商品':s==='saved'?'保存完成':'文件尚未关联至商品';el('cancel').hidden=['cancelled','saved'].includes(s);el('cancel').textContent=['ready','savefail','failed'].includes(s)?'移除文件':'取消上传'}el('scenario').onchange=e=>render(e.target.value);el('cancel').onclick=()=>render('cancelled');el('retry').onclick=()=>render('process');el('finish').onclick=()=>render(state==='upload'?'verify':'ready');el('save').onclick=()=>render(state==='savefail'?'saved':'savefail');render('upload');</script></html>
