<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整呈现 · Banner 局部原型</title>
<style>:root{--color-page: #18160f;--color-surface: #211e16;--color-deep: #100f0a;--color-text-primary: #ede8df;--color-text-secondary: rgb(237 232 223 / 0.5);--color-brand-gold: #c8a055;--color-border-default: rgb(255 255 255 / 0.07);}*{box-sizing:border-box}body{margin:0;background:var(--color-page);color:var(--color-text-primary);font-family:"PingFang SC","Microsoft YaHei",sans-serif}header{padding:40px 4vw 24px;border-bottom:1px solid var(--color-border-default)}small,.eyebrow{color:var(--color-brand-gold);letter-spacing:.16em}h1{font-family:"Songti SC",serif;font-size:38px;font-weight:500;margin:12px 0}p{line-height:1.7;color:var(--color-text-secondary)}.controls{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px}label{font-size:13px}select{display:block;margin-top:8px;padding:8px;background:var(--color-surface);color:var(--color-text-primary);border:1px solid var(--color-border-default)}select:focus-visible{outline:2px solid var(--color-brand-gold)}main{display:flex;flex-wrap:wrap;gap:32px;padding:32px 4vw}.example{width:var(--phone);max-width:100%}h2{font-size:16px;font-weight:500;margin:0 0 16px}.phone{width:100%;padding:14px;background:var(--color-deep);border:1px solid var(--color-border-default);container-type:inline-size}.nav{font-size:13px;padding:4px 0 18px}.frame{background:var(--color-surface);width:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--color-border-default)}.home{height:58.133cqw;border-radius:16px}.brands{height:46.4cqw;border-radius:16px}.brand{height:50.667cqw;border-radius:4px}.detail{height:108cqw}.image-area{width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.brand .image-area{height:29.333cqw;flex:none}.frame img{width:100%;height:100%;object-fit:contain;display:block}.brand-copy{height:21.333cqw;padding:1.6cqw 3.2cqw;flex:none;background:var(--color-surface)}.brand-copy strong{display:block;font-size:5.6cqw;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy span,.brand-copy p{font-size:3.2cqw;line-height:1.55;margin:0;display:block}.brand-copy p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.below{font-size:13px;padding:18px 0;color:var(--color-text-secondary)}.caption{font-size:12px}.empty{font-size:14px;color:var(--color-text-secondary)}footer{padding:0 4vw 36px;font-size:12px;color:var(--color-text-secondary)}@media(max-width:600px){h1{font-size:28px}header{padding-top:24px}main{justify-content:center}}</style>
<header><div class="eyebrow">STONEX / REQ-0137</div><h1>让每一寸画面，完整呈现。</h1><p>四类大图 · 等比适配 · 稳定留白。品牌文字在独立区域展示。</p><div class="controls"><label>逻辑宽度<select id="width"><option>320</option><option selected>375</option><option>430</option></select></label><label>素材比例<select id="ratio"><option value="wide">宽图 2:1</option><option value="square">方图 1:1</option><option value="tall">竖图 1:2</option></select></label><label>图片状态<select id="state"><option value="ready">展示图</option><option value="fallback">缩略图回退</option><option value="loading">加载中</option><option value="empty">全部失败 / 空数据</option></select></label></div></header><main id="examples"></main><footer>局部设计原型 · 示例素材与状态均为本地 Mock · 不接入 API，不模拟视频或真实跳转。</footer>
<script>
const pages=[['首页 Banner','home','精选瓷砖','探索材质之美'],['品牌列表 Banner','brands','品牌矩阵','发现更多品牌'],['品牌详情头图','brand','岩境 · 品牌','品牌产品'],['商品详情顶部图片','detail','云岩系列','云岩 · 柔光瓷砖']];
function artwork(kind){const [w,h]=kind==='wide'?[800,400]:kind==='square'?[600,600]:[400,800];return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="rgb(198,191,171)"/><path d="M0 ${h*.18} Q ${w*.4} ${h*.55} ${w} ${h*.3} M0 ${h*.6} Q ${w*.6} ${h*.25} ${w} ${h*.88}" fill="none" stroke="rgb(135,128,110)" stroke-width="8"/><rect x="8" y="8" width="${w-16}" height="${h-16}" fill="none" stroke="rgb(60,55,44)" stroke-width="3"/><text x="24" y="42" font-size="24" fill="rgb(45,40,32)">完整画面 / 左上边缘</text><text x="${w-24}" y="${h-24}" text-anchor="end" font-size="24" fill="rgb(45,40,32)">右下边缘 / STONEX</text><text x="${w/2}" y="${h/2}" text-anchor="middle" font-family="serif" font-size="34" fill="rgb(60,55,44)">云 岩</text></svg>`)}
function render(){document.documentElement.style.setProperty('--phone',width.value+'px');examples.innerHTML=pages.map(([title,cls,nav,below])=>`<section class="example"><h2>${title}</h2><div class="phone"><div class="nav">${nav}</div><div class="frame ${cls}"><div class="image-area">${['ready','fallback'].includes(state.value)?`<img alt="带有四周边框和边缘文字的比例测试图" src="${artwork(ratio.value)}">`:`<div class="empty">${state.value==='loading'?'加载中…':'暂无图片'}</div>`}</div>${cls==='brand'?'<div class="brand-copy"><strong>岩境瓷砖 · 自然之境</strong><span>STONE & NATURE</span><p>从自然纹理汲取灵感，为生活空间带来温润与质感。</p></div>':''}</div><div class="below">${below}</div></div><p class="caption">${width.value} pt · ${state.selectedOptions[0].text} · ${ratio.selectedOptions[0].text}</p></section>`).join('')}
const width=document.getElementById('width'),ratio=document.getElementById('ratio'),state=document.getElementById('state'),examples=document.getElementById('examples');[width,ratio,state].forEach(x=>x.addEventListener('change',render));render();
</script></html>
