<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REQ-0074 Task Trace Feedback Prototype</title>
    <style>
      :root {
        --page: #18160f;
        --surface: #211e16;
        --surface-2: #2a261c;
        --text: #ede8df;
        --muted: rgba(237, 232, 223, 0.58);
        --faint: rgba(237, 232, 223, 0.32);
        --border: rgba(255, 255, 255, 0.1);
        --gold: #c8a055;
        --danger: #d66b55;
        --success: #77b88a;
        --info: #7aa7c7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.7;
      }

      main {
        min-height: 100vh;
        padding: 32px;
      }

      .shell {
        max-width: 1080px;
        margin: 0 auto;
      }

      .page-title {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 400;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.8fr);
        gap: 20px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 20px;
      }

      .task-feedback {
        display: grid;
        gap: 16px;
      }

      .status-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(200, 160, 85, 0.35);
        border-radius: 2px;
        padding: 2px 8px;
        color: var(--gold);
        font-size: 12px;
      }

      .summary {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .trace-box {
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--surface-2);
        padding: 12px;
      }

      .trace-label {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 12px;
      }

      .trace-id {
        display: block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 13px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button {
        border: 1px solid var(--border);
        border-radius: 2px;
        background: transparent;
        color: var(--text);
        padding: 8px 12px;
        font-size: 13px;
      }

      .button.primary {
        border-color: rgba(200, 160, 85, 0.45);
        background: var(--gold);
        color: #15120c;
      }

      .timeline {
        display: grid;
        gap: 10px;
      }

      .span-row {
        display: grid;
        grid-template-columns: 120px 1fr auto;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding: 10px 0;
        font-size: 13px;
      }

      .span-row:last-child {
        border-bottom: 0;
      }

      .span-name {
        color: var(--text);
      }

      .span-meta {
        color: var(--muted);
      }

      .ok {
        color: var(--success);
      }

      .failed {
        color: var(--danger);
      }

      .slow {
        color: var(--info);
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        border: 1px solid rgba(200, 160, 85, 0.3);
        border-radius: 3px;
        background: var(--surface-2);
        color: var(--text);
        padding: 10px 14px;
        font-size: 13px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      }

      @media (max-width: 780px) {
        main {
          padding: 18px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .status-row,
        .span-row {
          grid-template-columns: 1fr;
        }

        .status-row {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <h1 class="page-title">复杂任务反馈</h1>
        <div class="grid">
          <section class="panel task-feedback" aria-label="任务反馈">
            <div class="status-row">
              <div>
                <span class="badge">partial_success</span>
                <p class="summary">批量上架已处理 128 项，成功 121 项，失败 7 项。失败项已写入任务时间线。</p>
              </div>
              <button class="button primary" type="button">查看日志审计</button>
            </div>
            <div class="trace-box">
              <p class="trace-label">task_trace_id</p>
              <code class="trace-id">task_20260726_batch_publish_sku_9f8c2a71</code>
            </div>
            <div class="actions">
              <button class="button" type="button">复制追踪标识</button>
              <button class="button" type="button">复制错误摘要</button>
            </div>
          </section>

          <aside class="panel" aria-label="任务摘要">
            <div class="timeline">
              <div class="span-row">
                <span class="span-name">validate_input</span>
                <span class="span-meta">128 items</span>
                <span class="ok">success</span>
              </div>
              <div class="span-row">
                <span class="span-name">batch_process</span>
                <span class="span-meta">2.8s, slowest span</span>
                <span class="slow">slow</span>
              </div>
              <div class="span-row">
                <span class="span-name">item_failures</span>
                <span class="span-meta">7 items, E_SKU_STATE_INVALID</span>
                <span class="failed">failed</span>
              </div>
              <div class="span-row">
                <span class="span-name">audit_log</span>
                <span class="span-meta">request_id linked</span>
                <span class="ok">success</span>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div class="toast">追踪标识已复制</div>
  </body>
</html>
