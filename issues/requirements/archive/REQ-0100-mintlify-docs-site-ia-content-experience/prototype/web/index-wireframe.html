<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>REQ-0100 Mintlify 文档站首页线框</title>
  </head>
  <body>
    <header>
      <p>瓷砖信息管理平台文档</p>
      <h1>按角色和场景查找产品使用说明</h1>
      <nav>
        <a href="../../../mintlify/docs/latest/overview.mdx">查看当前版本</a>
        <a href="../../../mintlify/releases/v0.3.4/announcement.mdx">浏览发布公告</a>
      </nav>
    </header>
    <main>
      <section aria-labelledby="roles">
        <h2 id="roles">角色入口</h2>
        <article>
          <h3>企业员工</h3>
          <p>维护品牌、证书、Banner、分类、规格、SKU 和媒体素材。</p>
        </article>
        <article>
          <h3>店主 / 导购</h3>
          <p>浏览小程序首页、分类、品牌、证书、商品详情和收藏。</p>
        </article>
        <article>
          <h3>系统管理员</h3>
          <p>查看用户管理、日志审计、系统设置和接口文档入口。</p>
        </article>
      </section>
      <section aria-labelledby="tasks">
        <h2 id="tasks">常用任务</h2>
        <ul>
          <li>商品资料维护</li>
          <li>品牌、证书、Banner 与媒体</li>
          <li>小程序浏览、搜索、商品与收藏</li>
          <li>常见问题</li>
        </ul>
      </section>
      <section aria-labelledby="versions">
        <h2 id="versions">版本</h2>
        <p>latest 指向最新已发布且 usage docs 校验通过的版本。</p>
      </section>
    </main>
  </body>
</html>
