<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REQ-0084 Web 弹窗禁用外部点击关闭 Prototype</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #18160f;
        --surface: #211e16;
        --surface-2: #2a261b;
        --text: #ede8df;
        --muted: rgba(237, 232, 223, 0.58);
        --border: rgba(255, 255, 255, 0.12);
        --gold: #c8a055;
        --danger: #d2684b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        min-height: 100vh;
        padding: 28px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 18px;
      }

      .brand {
        color: var(--gold);
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 0;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0;
      }

      .button {
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        min-height: 36px;
        padding: 0 14px;
        border-radius: 2px;
        cursor: pointer;
      }

      .button.primary {
        border-color: var(--gold);
        background: var(--gold);
        color: #18160f;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      .panel {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 3px;
        padding: 16px;
        min-height: 120px;
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 16px;
        font-weight: 400;
      }

      .panel p,
      .hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(0, 0, 0, 0.58);
      }

      .dialog {
        width: min(880px, calc(100vw - 44px));
        max-height: min(720px, calc(100vh - 44px));
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--surface);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      }

      .dialog-header,
      .dialog-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }

      .dialog-footer {
        justify-content: flex-end;
        border-top: 1px solid var(--border);
        border-bottom: 0;
      }

      .icon-button {
        width: 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 20px;
      }

      .dialog-body {
        overflow: auto;
        padding: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--surface-2);
        color: var(--text);
        padding: 10px 12px;
        font: inherit;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .upload {
        margin-top: 14px;
        border: 1px dashed var(--border);
        border-radius: 3px;
        padding: 14px;
      }

      .status {
        margin-top: 14px;
        border-left: 2px solid var(--gold);
        background: rgba(200, 160, 85, 0.08);
        color: var(--text);
        padding: 10px 12px;
        font-size: 13px;
      }

      .status.danger {
        border-left-color: var(--danger);
        background: rgba(210, 104, 75, 0.12);
      }

      @media (max-width: 760px) {
        .grid,
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-hidden="true">
      <div class="toolbar">
        <div>
          <div class="brand">TilesFST Admin</div>
          <h1>弹窗外部点击不关闭</h1>
        </div>
        <button class="button primary" type="button">新增 SKU</button>
      </div>

      <section class="grid">
        <article class="panel">
          <h2>表单弹窗</h2>
          <p>外部点击保持打开，字段内容不丢失。</p>
        </article>
        <article class="panel">
          <h2>确认弹窗</h2>
          <p>必须明确点击取消或确认，避免流程被误触中断。</p>
        </article>
        <article class="panel">
          <h2>上传弹窗</h2>
          <p>上传状态继续流转，成功后同会话即时回显。</p>
        </article>
      </section>
    </main>

    <div class="overlay" role="presentation">
      <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header class="dialog-header">
          <div>
            <div class="brand">Modal Policy</div>
            <h1 id="dialog-title">编辑 SKU 资料</h1>
          </div>
          <button class="icon-button" type="button" aria-label="关闭弹窗">×</button>
        </header>

        <div class="dialog-body">
          <div class="form-grid">
            <label>
              SKU 名称
              <input value="灰岩通体砖 750x1500" />
            </label>
            <label>
              所属品牌
              <input value="TilesFST" />
            </label>
          </div>
          <label style="margin-top: 14px">
            备注
            <textarea>点击遮罩或弹窗外空白区域时，本弹窗保持打开，当前输入不丢失。</textarea>
          </label>
          <div class="upload">
            <strong>上传状态</strong>
            <p class="hint">idle → uploading → done/failed；外部点击不打断上传链路。</p>
            <div class="status">当前示例：done，缩略图或文件卡片应即时回显。</div>
          </div>
          <div class="status danger">外部点击反馈示例：弹窗已保持打开，请使用右上角关闭或底部按钮。</div>
        </div>

        <footer class="dialog-footer">
          <button class="button" type="button">取消</button>
          <button class="button primary" type="button">保存</button>
        </footer>
      </section>
    </div>
  </body>
</html>
