<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小程序价格状态 · REQ-0133</title>
<style>
:root{--page:#18160F;--surface:#211E16;--compact:#252116;--brand:#C8A055;--price:#F87171;--text:#EDE8DF;--muted:#AFA58E;--line:#423B2B;--tile:#6d665a}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1220px;margin:auto;padding:44px 24px}header{border-bottom:1px solid var(--line);padding-bottom:24px}.eyebrow{color:var(--brand);font-size:12px;letter-spacing:2px}h1{font-size:28px;font-weight:500;margin:12px 0}p{color:var(--muted);line-height:1.7}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}button{background:transparent;border:1px solid var(--line);color:var(--text);padding:10px 16px;cursor:pointer;border-radius:3px}button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}.scenes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}section{min-width:0}h2{font-size:15px;font-weight:500;color:var(--muted);margin-bottom:16px}.card,.detail,.favorite{background:var(--surface);padding:18px;border:1px solid var(--line);border-radius:3px}.tile{height:172px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text);letter-spacing:2px}.name{font-size:17px;margin:16px 0 8px}.meta,[data-role="label"]{font-size:12px;color:var(--muted)}.price-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:16px}[data-role="amount"]{color:var(--price);font-size:22px;font-weight:800;overflow-wrap:anywhere}[data-role="placeholder"]{color:var(--muted);font-size:18px}.detail [data-role="amount"]{font-size:30px}.recommend{background:var(--compact);padding:14px;margin-top:28px}.recommend [data-role="amount"]{font-size:15px}.favorite{margin-bottom:12px}.note{font-size:12px}.badge{color:var(--brand);font-size:12px}.footer{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;font-size:12px}@media(max-width:760px){main{padding:24px 16px}.scenes{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><main><header><div class="eyebrow">菲尚特 · 价格展示</div><h1>清楚识别每一份参考价格</h1><p>局部视觉原型 · 合成数据 · 配色候选，未作最终验收</p></header>
<nav aria-label="原型状态"><button type="button" data-state="valid" aria-pressed="true">有效金额</button><button type="button" data-state="empty" aria-pressed="false">暂无价格</button><button type="button" data-state="invalid" aria-pressed="false">商品失效</button></nav>
<div class="scenes"><section><h2>01 / 商品卡片</h2><article class="card"><div class="tile">瓷砖图片占位</div><div class="name">云雾灰 · 示例瓷砖</div><div class="meta">示例品牌 · 600 × 1200 mm</div><div class="price-line"><span data-role="label">参考价格</span><span data-price="¥128.00" data-role="amount">¥128.00</span></div></article></section>
<section><h2>02 / 详情与推荐</h2><article class="detail"><span class="badge">示例品牌</span><div class="name">云雾灰 · 示例瓷砖</div><div class="price-line"><span data-price="¥128.00" data-role="amount">¥128.00</span><span data-role="label">/片</span></div><p class="note">实际价格以门店最终确认为准</p><div class="recommend"><div class="meta">同系列推荐 · 示例商品</div><div class="price-line"><span data-price="¥96.00" data-role="amount">¥96.00</span></div></div></article></section>
<section><h2>03 / 收藏价格</h2><article class="favorite"><div class="name">长金额示例</div><div class="meta">示例规格 · 示例品牌</div><div class="price-line"><span data-price="¥12,800.50" data-role="amount">¥12,800.50</span></div></article><article class="favorite"><div class="name">未维护价格示例</div><div class="price-line"><span data-role="placeholder">暂无</span></div></article><article class="favorite"><div class="name">失效收藏示例</div><div class="price-line"><span data-role="placeholder">暂不可查看</span></div></article></section></div>
<p class="footer">本页仅定义金额与状态的配色关系；产品布局及交互以现有小程序为准。</p></main>
<script>
for(const button of document.querySelectorAll('[data-state]'))button.addEventListener('click',()=>{const state=button.dataset.state;for(const b of document.querySelectorAll('[data-state]'))b.setAttribute('aria-pressed',String(b===button));for(const el of document.querySelectorAll('[data-price]')){el.dataset.role=state==='valid'?'amount':'placeholder';el.textContent=state==='valid'?el.dataset.price:state==='empty'?'暂无':'暂不可查看'}});
</script></body></html>
