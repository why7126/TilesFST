<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>REQ-0119 System Settings Media Display Size Prototype</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #18160f;
        --surface: #211e16;
        --line: rgba(255, 255, 255, 0.12);
        --text: #ede8df;
        --muted: rgba(237, 232, 223, 0.58);
        --gold: #c8a055;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: Inter, "PingFang SC", system-ui, sans-serif;
      }
      .page {
        padding: 28px;
      }
      .hero {
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }
      .eyebrow {
        color: var(--gold);
        font-size: 10px;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 6px;
        font-size: 24px;
        font-weight: 500;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 20px;
        margin-top: 24px;
      }
      .nav,
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .nav div {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }
      .nav .active {
        color: var(--gold);
      }
      .section {
        padding: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      label {
        display: grid;
        gap: 8px;
      }
      .label {
        font-size: 12px;
        color: var(--text);
      }
      input,
      .readonly {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 0 10px;
      }
      .help {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .footer {
        border-top: 1px solid var(--line);
        padding: 16px 20px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      button {
        height: 34px;
        border-radius: 2px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        padding: 0 14px;
      }
      .primary {
        background: var(--gold);
        color: #18160f;
        border-color: var(--gold);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="eyebrow">SYSTEM / SYSTEM SETTINGS</div>
        <h1>媒体与存储配置</h1>
        <div class="muted">上传限制、图片派生规格与对象存储只读策略。</div>
      </section>
      <section class="layout">
        <nav class="nav" aria-label="系统设置分组">
          <div>基础信息</div>
          <div>安全策略</div>
          <div class="active">媒体与存储</div>
          <div>通知设置</div>
          <div>审计配置</div>
        </nav>
        <article class="panel">
          <div class="section">
            <h2>上传限制与图片生成策略</h2>
            <p class="muted">作用于后续新上传和维护任务重生成的媒体对象。</p>
            <div class="grid">
              <label>
                <span class="label">图片最大尺寸 (MB)</span>
                <input value="20" />
              </label>
              <label>
                <span class="label">缩略图体积目标上限 (KB)</span>
                <input value="0" />
                <span class="help">0 表示不限制；仅影响后续新生成缩略图。</span>
              </label>
              <label>
                <span class="label">详情展示图体积目标上限 (KB)</span>
                <input value="768" />
                <span class="help">默认 768KB；仅影响后续新生成 display 图，与缩略图目标独立。</span>
              </label>
            </div>
          </div>
          <div class="section">
            <h2>对象存储策略</h2>
            <div class="grid">
              <label>
                <span class="label">默认存储桶</span>
                <div class="readonly">tilesfst</div>
              </label>
              <label>
                <span class="label">Key 生成规则</span>
                <div class="readonly">单桶 + 标准前缀 + 同目录派生 key</div>
              </label>
            </div>
          </div>
          <footer class="footer">
            <button>取消</button>
            <button>恢复默认</button>
            <button class="primary">保存设置</button>
          </footer>
        </article>
      </section>
    </main>
  </body>
</html>
