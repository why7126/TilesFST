    rationale: "API 请求日志统一 Request Snapshot：P1 平台治理 update 能力，影响请求日志 middleware、日志服务/仓储、SQLite/MySQL schema 或 metadata、日志详情 API、OpenAPI/Orval、管理端日志详情抽屉、跨端 client_type 兼容与敏感字段脱敏测试；不包含外部 APM、日志全文检索、历史日志回填、运维级日志接入或完整原始请求/响应体保存。"
  - id: REQ-0072-client-request-identity-standard
    change: standardize-client-request-identity
    size: L
    story_points: 5
    estimated_person_days: 5.0
    rationale: "前台后台与小程序统一客户端请求标识规范：P1 平台治理 update 能力，影响后端 request logging middleware、日志 schema / repository / service、Web 管理端与店主 Web API client、小程序 request 封装、日志审计列表/详情展示、OpenAPI/Orval、SQLite/MySQL schema/docs/tests；不引入外部分布式链路追踪平台，不改变认证授权边界，不保存敏感 Header/Cookie/Token/完整敏感请求体。"
  - id: REQ-0073-task-trace-parent-request-model
