  - id: REQ-0074-task-trace-coverage-expansion
    change: update-task-trace-coverage-expansion
    size: L
    story_points: 5
    estimated_person_days: 5.0
    rationale: "任务型接口 Task Trace 覆盖扩展：P1 update 型平台治理能力，影响后端 Task Trace helper、同步/异步/批量任务 span、管理端复杂任务追踪标识反馈、API/DB/OpenAPI/Orval/docs/tests 与 smoke evidence stub；不建设完整 APM，不一次性覆盖所有历史接口，不新增导入导出业务能力。"
  - id: REQ-0075-audit-log-task-trace-linking
