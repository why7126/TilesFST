# 本地开发 / 演示 Docker Compose 编排。
# 维护要求：新增或修改 service、environment、ports、volumes、networks 时，必须同步补充注释并更新 .env.example。
name: tilesfst

services:
  # FastAPI 后端服务，负责 API、认证、媒体元数据与受控对象存储读取。
  tilesfst-backend:
    # 后端镜像构建上下文限定在 src/backend。
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      args:
        # 可在 .env 中覆盖为镜像源，例如 m.daocloud.io/docker.io/python:3.12-slim。
        BACKEND_PYTHON_BASE_IMAGE: ${BACKEND_PYTHON_BASE_IMAGE:-python:3.12-slim}
    # 固定容器名便于本地 docker logs / exec 调试。
    container_name: tilesfst-backend
    # 服务异常退出后自动拉起；手动停止或 docker compose down 后不自启。
    restart: unless-stopped
    # 根目录 .env 提供本地端口、数据库、对象存储与管理员初始化配置。
    env_file:
      - .env
    # 宿主机端口可通过 HOST_PORT_BACKEND 覆盖；容器内 FastAPI 固定 8000。
    ports:
      - "${HOST_PORT_BACKEND:-8000}:8000"
    # 本地持久化目录：SQLite、处理产物与临时文件均落在 data/ 下。
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/processed:/app/data/processed
      - ./data/tmp:/app/data/tmp
    # 所有服务加入同一个 bridge 网络，使用 service name 互访。
    networks:
      - tilesfst

  # React Web 展示端 / 管理端，容器内由 Nginx 托管静态资源并反代 API。
  tilesfst-web:
    # Web 构建需要项目根上下文，以便同时复制 src/web 与 src/shared。
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        # 可在 .env 中覆盖为镜像源，例如 m.daocloud.io/docker.io/node:22-alpine。
        WEB_NODE_BASE_IMAGE: ${WEB_NODE_BASE_IMAGE:-node:22-alpine}
        # 可在 .env 中覆盖为镜像源，例如 m.daocloud.io/docker.io/nginx:1.27-alpine。
        WEB_NGINX_BASE_IMAGE: ${WEB_NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    # 固定容器名便于本地访问与排障。
    container_name: tilesfst-web
    # 服务异常退出后自动拉起；手动停止或 docker compose down 后不自启。
    restart: unless-stopped
    # 读取 HOST_PORT_WEB 等前端/部署变量；构建期变量仍由 Dockerfile 控制。
    env_file:
      - .env
    # Nginx 模板仅替换 UPLOAD_* 变量，避免误替换 $host 等 Nginx 内置变量。
    environment:
      NGINX_ENVSUBST_FILTER: "^UPLOAD_"
      # 上传专用 body 限制，须不小于 MAX_VIDEO_SIZE_MB / MAX_IMAGE_SIZE_MB / MAX_FILE_SIZE_MB。
      UPLOAD_CLIENT_MAX_BODY_SIZE: ${UPLOAD_CLIENT_MAX_BODY_SIZE:-512m}
      # 浏览器上传请求体读取超时，默认 600 秒用于较大视频。
      UPLOAD_CLIENT_BODY_TIMEOUT_SECONDS: ${UPLOAD_CLIENT_BODY_TIMEOUT_SECONDS:-600}
      # Web Nginx 到 tilesfst-backend 建连超时；默认 60 秒即可覆盖容器网络建连。
      UPLOAD_PROXY_CONNECT_TIMEOUT_SECONDS: ${UPLOAD_PROXY_CONNECT_TIMEOUT_SECONDS:-60}
      # Web Nginx 向 tilesfst-backend 发送上传请求超时，默认 600 秒。
      UPLOAD_PROXY_SEND_TIMEOUT_SECONDS: ${UPLOAD_PROXY_SEND_TIMEOUT_SECONDS:-600}
      # Web Nginx 等待 tilesfst-backend 上传响应超时，默认 600 秒。
      UPLOAD_PROXY_READ_TIMEOUT_SECONDS: ${UPLOAD_PROXY_READ_TIMEOUT_SECONDS:-600}
      # Web Nginx 向浏览器发送响应超时，默认 600 秒。
      UPLOAD_SEND_TIMEOUT_SECONDS: ${UPLOAD_SEND_TIMEOUT_SECONDS:-600}
      # 大文件上传默认关闭请求缓冲，减少先落 Nginx 临时文件导致的总耗时。
      UPLOAD_PROXY_REQUEST_BUFFERING: ${UPLOAD_PROXY_REQUEST_BUFFERING:-off}
    # 宿主机端口可通过 HOST_PORT_WEB 覆盖；容器内 Nginx 固定 80。
    ports:
      - "${HOST_PORT_WEB:-3000}:80"
    # Web 运行时通过 Nginx 反代访问 tilesfst-backend。
    depends_on:
      - tilesfst-backend
    networks:
      - tilesfst

  # MinIO 对象存储，本地开发用于图片、视频、文档等媒体资产。
  tilesfst-minio:
    # 仅在明确使用本地自建对象存储时启动；云上 COS/TOS 等场景不启用该 profile。
    profiles:
      - self-hosted-storage
    # 本地 demo 使用官方最新镜像；生产部署应评估固定版本标签。
    image: minio/minio:latest
    container_name: tilesfst-minio
    # 本地自建对象存储异常退出后自动拉起，避免上传链路中断。
    restart: unless-stopped
    # /data 为对象数据目录，9001 为控制台端口。
    command: server /data --console-address ":9001"
    # MinIO root 账号从对象存储示例密钥读取；默认值仅允许本地开发使用。
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    # API 与 Console 宿主机端口均可通过 .env 覆盖，容器内端口保持固定。
    ports:
      - "${HOST_PORT_MINIO_API:-9000}:9000"
      - "${HOST_PORT_MINIO_CONSOLE:-9001}:9001"
    # 对象数据持久化到本地 data/minio，禁止提交其中的运行时数据。
    volumes:
      - ./data/minio:/data
    networks:
      - tilesfst

  # MinIO 初始化任务：创建单一项目 Bucket，并关闭匿名访问。
  tilesfst-minio-init:
    # 仅随本地自建 MinIO profile 启动；云上对象存储由运维提前创建 Bucket。
    profiles:
      - self-hosted-storage
    # mc 客户端镜像只执行初始化命令，不承载业务流量。
    image: minio/mc:latest
    container_name: tilesfst-minio-init
    # 初始化任务失败时自动重试；成功退出后不重复执行。
    restart: on-failure
    # 等待 minio 容器启动后再尝试 alias / bucket 初始化。
    depends_on:
      - tilesfst-minio
    # 复用 .env 中的 OBJECT_STORAGE_ACCESS_KEY、OBJECT_STORAGE_SECRET_KEY、OBJECT_STORAGE_BUCKET。
    env_file:
      - .env
    # 初始化脚本保持幂等：Bucket 已存在时不报错，并确保匿名访问为 none。
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://tilesfst-minio:9000 $${OBJECT_STORAGE_ACCESS_KEY:-minioadmin} $${OBJECT_STORAGE_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/$${OBJECT_STORAGE_BUCKET:-tilesfst};
      mc anonymous set none local/$${OBJECT_STORAGE_BUCKET:-tilesfst};
      echo 'Object storage bucket initialized: '$${OBJECT_STORAGE_BUCKET:-tilesfst};
      "
    networks:
      - tilesfst

  # Mintlify 产品文档站预览服务；仅在明确启用 docs-site profile 时启动，不参与业务服务依赖链。
  tilesfst-docs-site:
    # 本地/演示使用项目内 docs-site 镜像，构建阶段预装 Mintlify CLI，避免运行时下载或污染宿主机 ~/.mintlify*。
    profiles:
      - docs-site
    build:
      context: .
      dockerfile: deploy/docs-site/Dockerfile
      args:
        DOCS_SITE_NODE_BASE_IMAGE: ${DOCS_SITE_NODE_BASE_IMAGE:-node:22-alpine}
        MINTLIFY_CLI_VERSION: ${MINTLIFY_CLI_VERSION:-4.2.45}
    image: ${TILESFST_DOCS_SITE_IMAGE_REPOSITORY:-tilesfst-docs-site}:${TILESFST_IMAGE_TAG:-local}
    container_name: tilesfst-docs-site
    # 文档站预览服务异常退出后自动拉起；未启用 profile 时不启动。
    restart: unless-stopped
    working_dir: /workspace/mintlify
    # 使用仓库内 mintlify/ 站点源目录；不得挂载真实 .env、密钥或运行时数据库。
    volumes:
      - ./mintlify:/workspace/mintlify:ro
      - tilesfst-docs-site-cache:/home/node/.mintlify
    # 容器内 Mintlify 预览端口固定 3000；宿主机端口通过 HOST_PORT_MINTLIFY_DOCS 覆盖。
    ports:
      - "${HOST_PORT_MINTLIFY_DOCS:-3001}:3000"
    command: mintlify dev --host 0.0.0.0 --port 3000
    networks:
      - tilesfst

volumes:
  tilesfst-docs-site-cache:

networks:
  # 本地开发 bridge 网络；服务间通过 tilesfst-backend、tilesfst-web、tilesfst-minio 名称互访。
  tilesfst:
    driver: bridge
