# 文档用途：Web容器Nginx配置
# 文档内容：静态资源托管、SPA回退、API反向代理、上传路径专用超时默认值
# 内容来源：AI自动生成，项目团队确认
# 更新方式：路由策略或后端服务名变化时更新
# 备注：docker-compose 环境下 tilesfst-backend 服务名可直接解析；容器镜像实际使用 nginx.conf.template 渲染

# 媒体专用访问日志保留状态与耗时，省略查询票据、Referer 和内部对象 Key。
log_format media_legacy_safe '$remote_addr "$request_method /media/[redacted]" $status $body_bytes_sent $request_time';
log_format media_read_safe '$remote_addr "$request_method /api/v1/media/read" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    # 须 >= max(MAX_IMAGE_SIZE_MB, MAX_VIDEO_SIZE_MB, MAX_FILE_SIZE_MB)；默认按 MAX_VIDEO_SIZE_MB=500 预留
    client_max_body_size 512m;
    client_body_timeout 600s;
    send_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/admin/uploads {
        proxy_pass http://tilesfst-backend:8000/api/v1/admin/uploads;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 512m;
        client_body_timeout 600s;
        send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/uploads/ {
        proxy_pass http://tilesfst-backend:8000/api/v1/admin/uploads/;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 512m;
        client_body_timeout 600s;
        send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 精确路由避免默认 combined 日志记录 ticket；不缓存媒体能力响应。
    location = /api/v1/media/read {
        access_log /var/log/nginx/access.log media_read_safe;
        # Nginx错误日志格式不可脱敏且包含完整请求；此路由仅保留上方安全状态/耗时日志。
        error_log /dev/null;
        proxy_pass http://tilesfst-backend:8000/api/v1/media/read;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Referrer-Policy no-referrer always;
    }

    location /api/ {
        proxy_pass http://tilesfst-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://tilesfst-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://tilesfst-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://tilesfst-backend:8000/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://tilesfst-backend:8000/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc/ {
        proxy_pass http://tilesfst-backend:8000/redoc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        access_log /var/log/nginx/access.log media_legacy_safe;
        error_log /dev/null;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://tilesfst-backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
