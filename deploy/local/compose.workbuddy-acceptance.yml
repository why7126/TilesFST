# Isolated acceptance only: no host ports, existing env files, or business volumes.
services:
  # Reuse the local dependency image; read current backend source without rebuilding it.
  backend:
    image: tilesfst-tilesfst-backend
    environment:
      # Generated in memory by verify-workbuddy-local.py, never copied from the real env.
      APP_ENV: test
      APP_DEBUG: "false"
      # Do not consume host-generated bytecode from the read-only source mount.
      PYTHONPYCACHEPREFIX: /tmp/acceptance-pycache
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Run the acceptance script}
      ADMIN_USERNAME: acceptance-admin
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Run the acceptance script}
      DATABASE_URL: sqlite:////app/data/sqlite/acceptance.db
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_ENDPOINT: storage:9000
      OBJECT_STORAGE_ACCESS_KEY: acceptance
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Run the acceptance script}
      OBJECT_STORAGE_BUCKET: acceptance
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "true"
      # Reduced limits exercise exact boundaries without allocating production-size files.
      MAX_IMAGE_SIZE_MB: "1"
      MAX_VIDEO_SIZE_MB: "1"
      MAX_FILE_SIZE_MB: "1"
    # Dedicated named volumes are scoped by the script-generated Compose project.
    volumes:
      - ../../src/backend/app:/app/app:ro
      - database:/app/data/sqlite
      - scratch:/app/data/tmp
    networks: [acceptance]
    depends_on: [storage]
  # Separate MinIO instance; its bucket and credentials have no link to existing storage.
  storage:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: acceptance
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?Run the acceptance script}
    command: server /data
    volumes:
      - objects:/data
    networks: [acceptance]
  # Test driver uses MCP subprocesses, real HTTP, read-only SQLite and MinIO stat checks.
  acceptance:
    image: tilesfst-tilesfst-backend
    working_dir: /workspace
    entrypoint: [/app/.venv/bin/python, /checks/verify-workbuddy-local.py, --worker]
    environment:
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      # Independent import-cache location, also inherited by every stdio subprocess.
      PYTHONPYCACHEPREFIX: /tmp/acceptance-pycache
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Run the acceptance script}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Run the acceptance script}
      TILESFST_API_BASE_URL: http://backend:8000
      TILESFST_CONNECTOR_ENABLE_WRITE_TOOLS: "true"
      TILESFST_CONNECTOR_WRITE_SCOPES: tile_sku:write,tile_sku:publish,brand:write,category:write,media:upload
      TILESFST_CONNECTOR_IDEMPOTENCY_DIR: /journal/ledger
      TILESFST_CONNECTOR_TIMEOUT_SECONDS: "60"
    volumes:
      - ../../src/mcp:/workspace/src/mcp:ro
      - ../scripts:/checks:ro
      - database:/evidence:ro
      - journal:/journal
    networks: [acceptance]
# No published ports and no external networks: only these test services can connect.
networks:
  acceptance:
    internal: true
# No explicit volume names: Compose project isolation is mandatory.
volumes:
  database:
  objects:
  scratch:
  journal:
